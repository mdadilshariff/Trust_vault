version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trustvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-trustvault}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustvault"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trustvault}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-trustvault}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-trustvault}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-trustvault}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-prod}
      UPLOAD_DIR: /storage/uploads
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
      ENVIRONMENT: development
    volumes:
      - uploads:/storage/uploads
    ports:
      - "8000:8000"
    command: >
      sh -c "cd /app && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
