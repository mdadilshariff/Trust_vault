services:
  - type: web
    name: trustvault-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: SYNC_DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_NAME
        value: tv_session
      - key: SESSION_MAX_AGE_SECONDS
        value: 86400
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173,http://localhost:4173"
      - key: UPLOAD_DIR
        value: "./storage/uploads"
